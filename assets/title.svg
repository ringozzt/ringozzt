<svg xmlns="http://www.w3.org/2000/svg" width="420" height="96" viewBox="0 0 420 96" role="img" aria-label="Ringo">
  <defs>
    <!-- can yellow / gold face -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="40%" stop-color="#FFD100"/>
      <stop offset="100%" stop-color="#E6A800"/>
    </linearGradient>
    <!-- slight metallic sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.2" flood-color="#001433" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- deep navy rear mass (can blue) -->
  <text x="210" y="62" text-anchor="middle"
        font-family="ui-sans-serif, SF Pro Display, Avenir Next Condensed, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="800" letter-spacing="1.5"
        fill="#001A44" transform="translate(0, 4)">Ringo</text>
  <text x="210" y="62" text-anchor="middle"
        font-family="ui-sans-serif, SF Pro Display, Avenir Next Condensed, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="800" letter-spacing="1.5"
        fill="#002B6B" transform="translate(0, 2.2)">Ringo</text>

  <!-- navy outline ring for crisp edge -->
  <text x="210" y="62" text-anchor="middle"
        font-family="ui-sans-serif, SF Pro Display, Avenir Next Condensed, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="800" letter-spacing="1.5"
        fill="none" stroke="#001433" stroke-width="5" stroke-linejoin="round"
        paint-order="stroke fill">Ringo</text>

  <!-- gold face -->
  <text x="210" y="62" text-anchor="middle"
        font-family="ui-sans-serif, SF Pro Display, Avenir Next Condensed, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="800" letter-spacing="1.5"
        fill="url(#gold)" filter="url(#soft)"
        paint-order="stroke fill" stroke="#0A2A6B" stroke-width="1.25" stroke-linejoin="round">Ringo</text>

  <!-- top highlight for can-metal feel -->
  <text x="210" y="62" text-anchor="middle"
        font-family="ui-sans-serif, SF Pro Display, Avenir Next Condensed, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="800" letter-spacing="1.5"
        fill="url(#sheen)">Ringo</text>
</svg>
